<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Botanical Plant Pot and Leaves Group -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Monstera / Sprout Leaf Left -->
    <path d="M256 290 C220 220 150 180 120 220 C100 248 115 285 140 295 C180 310 230 300 256 290 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M256 290 C200 250 145 235 120 220" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Monstera / Sprout Leaf Right -->
    <path d="M256 290 C292 220 362 180 392 220 C412 248 397 285 372 295 C332 310 282 300 256 290 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M256 290 C312 250 367 235 392 220" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Center Sprout / Main Stem -->
    <path d="M256 360 C256 310 256 230 256 160" stroke="#A5D6A7" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Top Heart-shaped Leaf -->
    <path d="M256 160 C210 110 220 70 256 105 C292 70 302 110 256 160 Z" fill="#E8F5E9" />

    <!-- Modern Terracotta Plant Pot -->
    <path d="M190 330 L322 330 L302 410 C300 418 293 424 285 424 L227 424 C219 424 212 418 210 410 Z" fill="#D7CCC8" />
    <rect x="180" y="316" width="152" height="18" rx="8" fill="#BCAAA4" />

    <!-- Glowing Water Droplet -->
    <path d="M256 175 C240 200 226 220 226 240 C226 257 239 270 256 270 C273 270 286 257 286 240 C286 220 272 200 256 175 Z" fill="url(#waterGrad)" />
    <!-- Droplet highlight -->
    <ellipse cx="248" cy="235" rx="5" ry="10" transform="rotate(-25 248 235)" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
